[build]
  command = "npm run build"

[build.environment]
  # Next 16 needs Node 20.9+; Netlify's default image still ships 18.
  NODE_VERSION = "22"

# The runtime sets the publish directory and wires up SSR and image optimization itself.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/**/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    X-Content-Type-Options = "nosniff"
